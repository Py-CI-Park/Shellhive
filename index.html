<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shellhive</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar__header">
        <h1 class="sidebar__title">Shellhive</h1>
      </div>
      <div class="sidebar__projects">
        <div class="sidebar__section-header">
          <span>Projects</span>
          <button class="sidebar__add-btn" id="addProjectBtn">+</button>
        </div>
        <ul class="sidebar__list" id="projectList"></ul>
      </div>
      <div class="sidebar__footer">
        <button class="sidebar__settings-btn" id="settingsBtn">Settings</button>
      </div>
    </aside>
    <main class="main">
      <div class="tabs" id="tabsContainer">
        <div class="tabs__list" id="tabsList"></div>
        <button class="tabs__new-btn" id="newTabBtn">+</button>
      </div>
      <div class="terminal-container" id="terminalContainer"></div>
    </main>
  </div>

  <!-- Add Project Modal -->
  <div class="modal" id="addProjectModal">
    <div class="modal__content">
      <div class="modal__header">
        <h2 class="modal__title">프로젝트 추가</h2>
        <button class="modal__close" id="closeAddProjectModal">×</button>
      </div>
      <div class="modal__body">
        <div class="form-group">
          <label for="projectName">프로젝트 이름</label>
          <input type="text" id="projectName" placeholder="예: my-project">
        </div>
        <div class="form-group">
          <label for="projectPath">경로</label>
          <div class="input-with-button">
            <input type="text" id="projectPath" placeholder="C:\Users\...">
            <button id="browsePathBtn">찾아보기</button>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--secondary" id="cancelAddProject">취소</button>
        <button class="btn btn--primary" id="confirmAddProject">추가</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
